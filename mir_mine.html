<!DOCTYPE html>
<html>
<head>
    <title>Mir Mine</title>
    <!-- Mobil uyumluluk için hayati kod -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Haritayı tam ekran yapar, beyaz boşluk bırakmaz */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background-color: #000; 
            overflow: hidden; 
        }
        #map { 
            height: 100%; 
            width: 100%; 
            background-color: #000;
        }
        /* Haritanın sol üst vs. kısımlarındaki tüm varsayılan butonları GİZLER */
        .leaflet-control-container { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Haritayı Mir Mine koordinatlarıyla başlatıyoruz (Bütün arayüz kapalı)
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([62.5283, 113.9933], 14); // Zoom seviyesi: 14 (Mir Mine için ideal yakınlık)

        // Yüksek Çözünürlüklü Esri Uydu Görüntüleri
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18
        }).addTo(map);
    </script>
</body>
</html>
